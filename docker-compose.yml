# The compose project name — the group every container, network and volume
# sits under (phantom-backend-api-1, phantom-backend_default, ...), whatever
# directory the file runs from. Service containers keep compose's own
# generated names on purpose: hardcoded container_name breaks recreation
# ordering and uniqueness.
name: phantom-backend

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      # The bootstrap superuser. Fresh installs name it `superuser` (.env);
      # the default is the name every install from before carries in its
      # volume — the image honours this only at first init.
      POSTGRES_USER: ${POSTGRES_USER:-phantom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: phantom
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phantom} -d phantom"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Published by .github/workflows/release.yml on every version tag. Both
    # `image:` and `build:` with pull_policy `missing`: plain `docker compose
    # up -d` PULLS (the install path — no repo on the box); `up -d --build`
    # builds from source (dev). PHANTOM_BACKEND_TAG is pinned in .env by
    # updater/apply.sh so the compose file on disk and the image are always the
    # same release; a fresh install runs `latest` until its first upgrade.
    # PHANTOM_BACKEND_API_IMAGE is a test hook (point it at a locally built name).
    image: ${PHANTOM_BACKEND_API_IMAGE:-ghcr.io/stephengpope/phantom-backend-api}:${PHANTOM_BACKEND_TAG:-latest}
    pull_policy: missing
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    environment:
      # The superuser's: boot creates the `migrator` and `backend` roles with
      # it and hangs up; the process runs as `backend` (storage/Database.ts).
      DATABASE_URL: postgres://${POSTGRES_USER:-phantom}:${POSTGRES_PASSWORD:?}@postgres:5432/phantom
      WORKSPACE_ROOT_PATH: /workspaces
      PORT: 8080
      API_KEY: ${API_KEY:?set in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in .env — openssl rand -base64 32}
      # Set, sign-in is on (people, organizations, invitations, API keys at
      # /api/auth). Empty: off, nothing changes.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Browser apps on another origin that may sign in here, comma-separated.
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      # Beside the magic link: AUTH_PASSWORD=1 for email + password; a GitHub
      # OAuth app's id and secret for GitHub sign-in.
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-}
      # Workspace containers are created through the socket proxy below — the
      # API never holds the socket and runs non-root.
      DOCKER_HOST: tcp://docker-proxy:2375
      # The named volume, by NAME: workspace containers mount per-session
      # subpaths of it. dockerd resolves mounts host-side, so an API-internal
      # path would come up empty.
      WORKSPACE_VOLUME: phantom-looper-workspaces
      # The agents' network, made by the API when missing: internet out,
      # inter-container traffic off — an agent reaches nothing on this server,
      # not another agent, not the stack. The interface carries the same name,
      # for the host firewall's metadata block (scripts/install.sh).
      AGENT_NETWORK: phantom-agents
      # The database server's container (compose: <project>-<service>-1). With
      # `agent_database_shared` on, a workspace container gets a private
      # internal network holding only it and this container, so its code
      # reaches its database and nothing else of the stack.
      AGENT_DATABASE_CONTAINER: phantom-backend-postgres-1
      # The disk-quota helper (below, the `disk-quota` profile): what holds an
      # agent's checkout to `container_disk_gb`. Off by default; without it
      # running, the setting is refused rather than ignored.
      DISK_QUOTA_URL: http://disk-quota:7000
      # The database console (CloudBeaver). The API proxies /db to it and
      # manages its container lifecycle based on the db_ui_enabled setting.
      DB_UI_URL: http://cloudbeaver:8978
      DB_UI_DSN: postgres://${POSTGRES_USER:-phantom}:${POSTGRES_PASSWORD:?}@postgres:5432/phantom
      # Where POST /update drops the requested release tag for the updater
      # sidecar (shared volume; the sidecar polls it).
      UPDATE_TRIGGER_DIR: /trigger
      # The api's OWN image name. A container cannot name its own image from
      # inside; handed in here, the disk cleanup can prune its old tags the
      # same way it prunes the session image's.
      API_IMAGE: ${PHANTOM_BACKEND_API_IMAGE:-ghcr.io/stephengpope/phantom-backend-api}
      # The bot's public address — the Telegram webhook registers at
      # https://<this>/telegram/webhook. Empty = telegram stays off.
      PHANTOM_BACKEND_ADDRESS: ${PHANTOM_BACKEND_ADDRESS:-}
      # Where Telegram reaches the webhook, when that is not the address above
      # — a dev box serves Caddy on localhost and Telegram through a tunnel
      # (ngrok). Empty: the address above.
      TELEGRAM_WEBHOOK_ADDRESS: ${TELEGRAM_WEBHOOK_ADDRESS:-}
    volumes:
      # Named volume, not a host bind: one filesystem under one kernel, so the
      # pool's atomic rename holds and inotify propagates between containers.
      # Workspace containers mount per-session subpaths of the same volume.
      - phantom-looper-workspaces:/workspaces
      - updater-trigger:/trigger
    # NOT a public surface: localhost only. Public traffic goes through caddy
    # (the `https` profile), which reaches this container as api:8080.
    ports:
      - "127.0.0.1:${PHANTOM_BACKEND_PORT:-8080}:8080"
    # autoheal (below) restarts this container when its HEALTHCHECK (in the
    # Dockerfile) flips to unhealthy — Docker's restart policy alone only
    # covers a crashed process, not a wedged one.
    labels:
      - autoheal=true
    # The stack's network, and the proxy's — which nothing else is on.
    networks: [default, docker]

  # Docker socket proxy: the only thing the API can reach. Exposes just the
  # endpoints the API needs (containers, exec, images, and networks — the
  # agents' network and each shared database's private one) on the internal
  # network; everything else (volumes, swarm, system) is refused. This is the
  # blast-radius boundary for an API compromise — the socket itself is
  # host-root-equivalent, and the API never touches it. It sits on its own
  # internal network that only the API joins: no agent, no other service can
  # reach it, whatever the proxy itself lets through.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      POST: 1
      INFO: 1
      # Log READS are allowed too (docker logs of the stack's containers) —
      # the assistant's docker_logs tool and nothing else uses them. The
      # write surface is unchanged.
      LOGS: 1
      VOLUMES: 0
      NETWORKS: 1
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker]

  # The disk-quota helper: caps each agent checkout with an XFS project quota
  # (phantom-agent-sdk/.../runtime/diskQuotaHelper.ts). Needs Docker's data
  # (/var/lib/docker) on XFS mounted with pquota — a manual server setup, see
  # docs/permissions.md. On with COMPOSE_PROFILES including disk-quota.
  # Privileged with Docker's data mounted: host-level, so it answers two
  # calls only and sits on the API's own internal network, out of every
  # agent's reach.
  disk-quota:
    image: ${PHANTOM_BACKEND_API_IMAGE:-ghcr.io/stephengpope/phantom-backend-api}:${PHANTOM_BACKEND_TAG:-latest}
    pull_policy: missing
    profiles: ["disk-quota"]
    restart: unless-stopped
    user: root
    privileged: true
    command: ["node", "phantom-agent-sdk/packages/backend/dist/runtime/diskQuotaHelper.js"]
    environment:
      QUOTA_MOUNT: /var/lib/docker
      QUOTA_ROOT: /var/lib/docker/volumes/phantom-looper-workspaces/_data
    volumes:
      - /var/lib/docker:/var/lib/docker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
    networks: [docker]

  # The database console at /db — CloudBeaver, proxied by the API. No published
  # ports: the only way in is through the API, which checks db_ui_enabled and
  # the API key. The API stops this container at boot when the setting is off,
  # and starts/stops it when the setting changes — so it uses zero resources
  # when disabled.
  cloudbeaver:
    image: dbeaver/cloudbeaver:26.2.0@sha256:c06c1859700bd9202d9d49ebc10ee2512d745997d05e7ca6423267b227af1ca7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # rootURI alone. Setting CLOUDBEAVER_SERVICE_URI as well serves the API
      # at /db/db/api/ — see the note in cloudbeaver/cloudbeaver.conf.
      CLOUDBEAVER_ROOT_URI: /db/
    volumes:
      - type: bind
        source: ./cloudbeaver/cloudbeaver.conf
        target: /opt/cloudbeaver/conf/cloudbeaver.conf
        read_only: true
        bind:
          # A missing release file must fail instead of becoming a directory.
          create_host_path: false
      - cloudbeaver-data:/opt/cloudbeaver/workspace

  # HTTPS terminator + reverse proxy — the ONLY public surface, and only with
  # the `https` profile (install.sh and scripts/setup.sh both turn it on via
  # COMPOSE_PROFILES in .env: dev runs this same stack, on Caddy's own CA).
  #
  # Caddy owns certificates end to end — nothing in the API writes TLS config.
  # PHANTOM_BACKEND_ADDRESS is a domain OR a bare public IP: Let's Encrypt issues real
  # certificates for both (IP certificates since 2026, 6-day lifetime, renewed
  # automatically — they need ports 80 and 443 reachable from the internet).
  # PHANTOM_BACKEND_TLS=internal swaps in Caddy's own CA for a private address; its
  # root certificate is the one file a client then trusts (`phantom ca`).
  caddy:
    image: caddy:2.11
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      PHANTOM_BACKEND_ADDRESS: ${PHANTOM_BACKEND_ADDRESS:-}
      PHANTOM_BACKEND_CERT_EMAIL: ${PHANTOM_BACKEND_CERT_EMAIL:-}
      PHANTOM_BACKEND_TLS: ${PHANTOM_BACKEND_TLS:-public}
    # The host ports are overridable for a dev box where 80/443 are taken;
    # an install leaves them alone (Let's Encrypt needs the real ones).
    ports:
      - "${PHANTOM_BACKEND_HTTP_PORT:-80}:80"
      - "${PHANTOM_BACKEND_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the internal CA live here. Losing this volume means
      # re-issuing (rate limits) and, in internal mode, a new root to trust.
      - caddy-data:/data
      - caddy-config:/config

  # Remote-upgrade sidecar. Polls the updater-trigger volume for a release tag
  # written by the api's POST /update, then spawns a detached one-shot helper
  # (updater/apply.sh) that pulls that tag's images, copies this file and the
  # rest of the host files OUT of the api image, pins PHANTOM_BACKEND_TAG in .env, and
  # `up -d`s the stack. It holds the raw docker socket — the API never does
  # (it only sees the proxy) — and deliberately has NO network surface: the
  # trigger is a file. PHANTOM_BACKEND_DIR must be the install dir's HOST path (the
  # helper bind-mounts it, and dockerd resolves bind paths on the host);
  # install.sh writes it to .env.
  updater:
    image: docker:27-cli
    restart: unless-stopped
    environment:
      PHANTOM_BACKEND_DIR: ${PHANTOM_BACKEND_DIR:-/opt/phantom-looper}
      # Test hooks — override which images apply.sh pulls. Empty in production.
      PHANTOM_BACKEND_API_IMAGE: ${PHANTOM_BACKEND_API_IMAGE:-}
      PHANTOM_BACKEND_SESSION_IMAGE: ${PHANTOM_BACKEND_SESSION_IMAGE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./updater:/updater:ro
      - updater-trigger:/trigger
    entrypoint: ["sh", "/updater/watch.sh"]

  # Restarts any container labeled autoheal=true when Docker marks it
  # unhealthy. Needs the docker socket to do so.
  autoheal:
    # Pinned by digest, not tag: upstream only maintains `latest` (the newest
    # version tag, 1.2.0, is from 2021), so a floating tag is the only fresh
    # one — the digest freezes those exact bits. Bump deliberately.
    image: willfarrell/autoheal:latest@sha256:8dff3993db56e6646a3febe690809809159aa14aa6b8ecd205db1f0bc1fbd0e1
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  # The docker proxy's: the API and the proxy, nothing else, no way out.
  docker:
    internal: true

volumes:
  pg-data:
  phantom-looper-workspaces:
    name: phantom-looper-workspaces   # fixed name — the API references it by name for subpath mounts
  cloudbeaver-data:
  caddy-data:
  caddy-config:
  updater-trigger:
