name: Release

# Fires on a version tag:  git tag v0.2.0 && git push --tags
#
# One tag → two images, both multi-arch (amd64 + arm64), pushed to ghcr.io:
#   ghcr.io/stephengpope/phantom-backend-api       the API server (Dockerfile)
#   ghcr.io/stephengpope/phantom-backend-session   every session's container (build/workspace)
# Each platform builds NATIVELY (images, 4 jobs) and pushes by digest; the
# manifests job (2 jobs) stitches each pair into one multi-arch tag.
#
# Each is tagged <tag> and — for a plain release — :latest. A tag containing a
# hyphen (v0.2.0-rc1) is a prerelease by semver's own rule and leaves :latest
# alone: fresh installs pull :latest, so an rc must never move it.
#
# The API image gets the tag baked in as APP_VERSION (served by GET /health);
# the API's default workspace_image setting is the workspace image at that SAME
# tag, so the two images are one release by construction. install.sh and
# updater/apply.sh copy the host files out of the API image, so everything a
# box needs for a release is these two images and nothing else.
# The cli job builds the four self-contained phantom-cli tarballs into a DRAFT
# release; publish (needs: manifests + cli) flips it public once every artifact
# exists. The draft gate is what makes a release atomic: install-cli.sh and a
# future self-update read `releases/latest`, and must never see a release
# whose tarball for their platform is still uploading. A failure anywhere
# leaves an inspectable draft, never a half-published release.
on:
  push:
    tags:
      - 'v*'

# Job-level permissions REPLACE this block, so each job states its own.
permissions:
  contents: read

jobs:
  # Each image × each platform on a NATIVE runner (arm64 on ubuntu-24.04-arm,
  # free for a public repo) — no QEMU: the session image's apt installs took
  # 23 minutes emulated, a few native. Each build pushes by DIGEST only; the
  # manifests job below stitches the two digests into one multi-arch tag.
  images:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: phantom-backend-api
            context: .
            dockerfile: Dockerfile
          - name: phantom-backend-session
            context: build/workspace
            dockerfile: build/workspace/Dockerfile
        platform:
          - { os: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { os: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.os }}
          build-args: |
            VERSION=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Hand the digest to the manifests job
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One multi-arch tag per image out of the two digests — and :latest for a
  # plain release (a hyphenated tag is a prerelease and leaves :latest alone).
  manifests:
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [phantom-backend-api, phantom-backend-session]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.name }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list and verify it
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}"
          TAGS=(-t "${IMAGE}:${GITHUB_REF_NAME}")
          case "$GITHUB_REF_NAME" in
            *-*) echo "prerelease $GITHUB_REF_NAME — leaving :latest alone" ;;
              *) TAGS+=(-t "${IMAGE}:latest") ;;
          esac
          docker buildx imagetools create "${TAGS[@]}" $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}"

  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Build the four platform tarballs
        run: ./scripts/build-cli.sh "$GITHUB_REF_NAME"
      - name: Create the draft release and upload the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist-cli/phantom-cli-*.tar.gz dist-cli/checksums.txt

  publish:
    runs-on: ubuntu-latest
    needs: [manifests, cli]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the previous tag, for the notes range
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes are commit subjects since the previous tag — best-effort:
          # a hiccup writing notes must never strand a built release as a
          # draft. Shipping beats annotating.
          PREV=$(git tag --sort=-v:refname | grep -v "^$GITHUB_REF_NAME\$" | head -1 || true)
          RANGE="${PREV:+$PREV..}$GITHUB_REF_NAME"
          git log --format='- %s' "$RANGE" 2>/dev/null | grep -vi '^- release v' > notes.txt || true
          if [ -s notes.txt ]; then NOTES=(--notes-file notes.txt); else NOTES=(); fi
          # semver's own rule: a hyphen in the tag is a prerelease — it must
          # never become `latest`, or every install-cli.sh run would get it.
          case "$GITHUB_REF_NAME" in
            *-*) FLAGS=(--draft=false --prerelease --latest=false) ;;
              *) FLAGS=(--draft=false --latest) ;;
          esac
          gh release edit "$GITHUB_REF_NAME" "${FLAGS[@]}" "${NOTES[@]}"
