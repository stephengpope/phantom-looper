# THE RUNNERS on a box with no api: a SESSION runner that runs workspaces (its
# own volume, the socket proxy) and a CLIENT runner that runs turns (nothing
# but the api) — both from the api's image with the runner entrypoint, each
# told which it is by RUN_SESSIONS / RUN_CLIENTS. On a Mac, `phantom-cli
# runner start` writes this file's .env and runs it. A server runs the same
# two as services of its own group (docker-compose.yml) instead.
#
# Each runner connects OUT to the backend; nothing listens here. Three values in
# .env say everything: BACKEND_URL, BACKEND_KEY (the service role key makes
# SHARED runners anyone's work may land on; a user role key makes THEIR runners,
# for their work alone — the key's prefix says which), and HOST_NAME (a label;
# defaults to the container's). RUNNER_DIR is this directory's absolute path:
# the updater's helper mounts it to recreate the stack on an upgrade.
#
# UPGRADES come from the backend (POST /runners/:id/update, or the group:
# /runners/update) as a job: the runner pulls the images and writes the tag to
# /trigger, and the `updater` sidecar — the server's own (updater/watch.sh,
# apply.sh) — recreates the stack on the new tag.
name: phantom-backend-runners

services:
  session-runner:
    container_name: phantom-backend-session-runner
    image: ${BACKEND_API_IMAGE:-ghcr.io/stephengpope/phantom-backend}:${BACKEND_TAG:-latest}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      docker-proxy:
        condition: service_started
    command: ["node", "dist/phantom-backend/runner.js"]
    # The image's health probe is the API's (/api/health on 8080); a host
    # serves no port. Its health is what `phantom-cli runner status` asks the backend.
    healthcheck:
      disable: true
    environment:
      RUN_SESSIONS: 1
      BACKEND_URL: ${BACKEND_URL:?set in .env — the backend's https address}
      BACKEND_KEY: ${BACKEND_KEY:?set in .env — the service role key or your user role key}
      HOST_NAME: ${HOST_NAME:-}
      # A backend on its own CA (BACKEND_TLS=internal): its root certificate, PEM.
      BACKEND_CA: ${BACKEND_CA:-}
      WORKSPACE_ROOT_PATH: /workspaces
      # The named volume, by NAME: workspace containers mount per-workspace
      # subpaths of it. dockerd resolves mounts host-side.
      WORKSPACE_VOLUME: ${WORKSPACE_VOLUME:-phantom-looper-workspaces}
      DOCKER_HOST: tcp://docker-proxy:2375
      # The agents' network: internet out, no container on it able to reach another.
      AGENT_NETWORK: ${AGENT_NETWORK:-phantom-agents}
      # The disk-quota helper, with the `disk-quota` profile on (XFS + pquota only).
      DISK_QUOTA_URL: http://disk-quota:7000
      API_IMAGE: ${BACKEND_API_IMAGE:-ghcr.io/stephengpope/phantom-backend}
      # Where an `update` job drops the release tag for the updater sidecar.
      UPDATE_TRIGGER_DIR: /trigger
      # The helper container's name: per stack, so a runner on the same
      # daemon as a server (a Mac) never reads the server's helper.
      HELPER_NAME: ${HELPER_NAME:-phantom-update-run-runners}
    volumes:
      - workspaces:/workspaces
      - updater-trigger:/trigger
    networks: [default, docker]

  # The client runner: turns. Same image, same key, same backend; no Docker,
  # no volume — it calls the model and the api's routes, as a cli does.
  client-runner:
    container_name: phantom-backend-client-runner
    image: ${BACKEND_API_IMAGE:-ghcr.io/stephengpope/phantom-backend}:${BACKEND_TAG:-latest}
    pull_policy: missing
    restart: unless-stopped
    command: ["node", "dist/phantom-backend/runner.js"]
    healthcheck:
      disable: true
    environment:
      RUN_CLIENTS: 1
      BACKEND_URL: ${BACKEND_URL:?set in .env — the backend's https address}
      BACKEND_KEY: ${BACKEND_KEY:?set in .env — the service role key or your user role key}
      HOST_NAME: ${HOST_NAME:-}
      BACKEND_CA: ${BACKEND_CA:-}
      API_IMAGE: ${BACKEND_API_IMAGE:-ghcr.io/stephengpope/phantom-backend}
      UPDATE_TRIGGER_DIR: /trigger
      HELPER_NAME: ${HELPER_NAME:-phantom-update-run-runners}
    volumes:
      - updater-trigger:/trigger

  # The updater sidecar, as on a server: waits for the runner to write a
  # release tag into /trigger, then spawns the one-shot helper that copies
  # this stack's files out of the new image into RUNNER_DIR, pins BACKEND_TAG
  # in .env and recreates the stack. Holds the docker socket; no network.
  updater:
    image: docker:27-cli
    restart: unless-stopped
    network_mode: none
    environment:
      BACKEND_DIR: ${RUNNER_DIR:?set in .env — this directory's absolute path}
      HOST_FILES_DIR: /host-files/runners
      HELPER_NAME: ${HELPER_NAME:-phantom-update-run-runners}
      BACKEND_API_IMAGE: ${BACKEND_API_IMAGE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./updater:/updater:ro
      - updater-trigger:/trigger
    entrypoint: ["sh", "/updater/watch.sh"]

  # The socket proxy: the only thing the host process can reach — containers,
  # exec, images, networks; never volumes, swarm or system.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      POST: 1
      INFO: 1
      LOGS: 1
      VOLUMES: 0
      NETWORKS: 1
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker]

  # The disk-quota helper, as on a server. Not on a Mac.
  disk-quota:
    image: ${BACKEND_API_IMAGE:-ghcr.io/stephengpope/phantom-backend}:${BACKEND_TAG:-latest}
    pull_policy: missing
    profiles: ["disk-quota"]
    restart: unless-stopped
    user: root
    privileged: true
    command: ["node", "phantom-agent-sdk/packages/backend/dist/runtime/diskQuotaHelper.js"]
    environment:
      QUOTA_MOUNT: /var/lib/docker
      QUOTA_ROOT: /var/lib/docker/volumes/${WORKSPACE_VOLUME:-phantom-looper-workspaces}/_data
    volumes:
      - /var/lib/docker:/var/lib/docker
    networks: [docker]

networks:
  docker:
    internal: true

volumes:
  workspaces:
    name: ${WORKSPACE_VOLUME:-phantom-looper-workspaces}
  updater-trigger:
